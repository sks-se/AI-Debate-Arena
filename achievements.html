<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achievements — Arena of Minds</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Orbitron:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --void:#05060c; --stone-deep:#0b0e1a; --stone:#141828;
  --blue-neon:#4fd8ff; --violet-neon:#a855f7; --gold-relic:#d9b46a; --ok:#4ee08a;
  --ink-hi:#eef1fb; --ink-lo:#8b93b3; --ink-faint:#525a78;
  --line:rgba(143,159,214,0.14);
  --radius-m:14px; --radius-l:24px;
  --ease:cubic-bezier(.16,.8,.28,1);
  --font-display:'Cinzel',serif; --font-ui:'Orbitron',sans-serif; --font-body:'Rajdhani',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--void);color:var(--ink-hi);font-family:var(--font-body);font-size:17px;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display);font-weight:700;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img,svg{display:block;max-width:100%;}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;}}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue-neon);outline-offset:2px;}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 80% 0%, rgba(168,85,247,.10), transparent 60%),
             radial-gradient(ellipse 50% 40% at 10% 100%, rgba(79,216,255,.10), transparent 60%), var(--void);}

.container{width:min(1080px,100% - 40px);margin-inline:auto;position:relative;z-index:1;}

header.top-nav{position:sticky;top:0;z-index:10;padding:16px 0;background:rgba(8,10,20,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
.nav-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:1.05rem;}
.brand svg{width:30px;height:30px;}
.nav-links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;}
.nav-links a{font-family:var(--font-ui);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:6px;color:var(--ink-lo);transition:color .2s ease,background .2s ease;}
.nav-links a:hover{color:var(--ink-hi);background:rgba(79,216,255,.08);}
.nav-links a.active{color:var(--blue-neon);}

main{padding:56px 0 90px;}
.page-head{text-align:center;margin-bottom:20px;}
.eyebrow{font-family:var(--font-ui);font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--blue-neon);}
.page-head h1{font-size:clamp(2rem,4.5vw,3rem);margin-top:14px;text-transform:uppercase;}
.page-head p{color:var(--ink-lo);margin-top:12px;}

.progress-summary{
  display:flex;align-items:center;justify-content:center;gap:14px;margin:26px auto 50px;
  font-family:var(--font-ui);font-size:.72rem;letter-spacing:.1em;color:var(--ink-lo);text-transform:uppercase;
}
.progress-summary .bar{width:180px;height:8px;border-radius:5px;background:rgba(255,255,255,.06);border:1px solid var(--line);overflow:hidden;}
.progress-summary .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue-neon),var(--violet-neon));transition:width 1s var(--ease);}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
.reveal.in{opacity:1;transform:translateY(0);}

.ach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px;}
.ach-card{
  position:relative;padding:28px 24px;border-radius:var(--radius-l);overflow:hidden;
  background:linear-gradient(180deg,rgba(20,24,40,.55),rgba(8,10,20,.7));
  border:1px solid var(--line);transition:transform .35s var(--ease),border-color .35s ease,box-shadow .35s ease;
}
.ach-card:hover{transform:translateY(-6px);border-color:rgba(79,216,255,.4);box-shadow:0 26px 50px -22px rgba(79,216,255,.25);}
.ach-card.locked{filter:grayscale(.6);opacity:.72;}
.ach-card.locked:hover{filter:grayscale(.3);opacity:.9;}
.ach-card.claimable{border-color:rgba(217,180,106,.5);box-shadow:0 0 30px -10px rgba(217,180,106,.4);}
.ach-card.claimable::after{
  content:'Ready to claim';position:absolute;top:14px;right:14px;font-family:var(--font-ui);font-size:.58rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--gold-relic);border:1px solid rgba(217,180,106,.4);
  padding:4px 8px;border-radius:20px;animation:claim-blink 1.6s ease-in-out infinite;
}
@keyframes claim-blink{0%,100%{opacity:1;}50%{opacity:.4;}}

.ach-icon{
  width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;
  background:radial-gradient(circle,rgba(79,216,255,.18),rgba(168,85,247,.08));border:1px solid var(--line);
  position:relative;
}
.ach-card.unlocked .ach-icon{background:radial-gradient(circle,rgba(78,224,138,.22),rgba(78,224,138,.06));border-color:rgba(78,224,138,.4);}
.ach-icon svg{width:28px;height:28px;stroke:var(--blue-neon);}
.ach-card.unlocked .ach-icon svg{stroke:var(--ok);}
.ach-card.locked .ach-icon svg{stroke:var(--ink-faint);}

.ach-name{font-size:1.2rem;margin-bottom:6px;}
.ach-desc{color:var(--ink-lo);font-size:.94rem;margin-bottom:18px;line-height:1.5;}

.ach-progress-row{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-ui);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
.ach-track{height:7px;border-radius:5px;background:rgba(255,255,255,.06);border:1px solid var(--line);overflow:hidden;}
.ach-fill{height:100%;width:0%;border-radius:5px;background:linear-gradient(90deg,var(--blue-neon),var(--violet-neon));transition:width 1.1s var(--ease);}
.ach-card.unlocked .ach-fill{background:linear-gradient(90deg,var(--ok),#9ef7c4);}

.ach-status{
  margin-top:16px;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-ui);
  font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);
}
.ach-status svg{width:13px;height:13px;stroke:var(--ok);}

.claim-btn{
  margin-top:16px;width:100%;padding:10px;border-radius:8px;font-family:var(--font-ui);font-size:.68rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--void);
  background:linear-gradient(120deg,var(--gold-relic),#ffe3a3);font-weight:700;
  transition:transform .2s ease,box-shadow .2s ease;
}
.claim-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(217,180,106,.5);}

/* unlock burst effect */
.unlock-burst{position:absolute;inset:0;pointer-events:none;opacity:0;}
.ach-card.bursting .unlock-burst{opacity:1;}
.unlock-burst::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at 50% 30%, rgba(255,235,190,.5), transparent 60%);
  animation:burst-flash .8s ease forwards;
}
@keyframes burst-flash{0%{opacity:0;transform:scale(.6);}30%{opacity:1;}100%{opacity:0;transform:scale(1.4);}}
.checkmark-pop{
  position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;
  background:var(--ok);display:flex;align-items:center;justify-content:center;
  transform:scale(0);opacity:0;
}
.ach-card.bursting .checkmark-pop{animation:check-pop .5s var(--ease) forwards .3s;}
@keyframes check-pop{to{transform:scale(1);opacity:1;}}
.checkmark-pop svg{width:16px;height:16px;stroke:var(--void);stroke-width:3;}

footer{padding:40px 0;text-align:center;color:var(--ink-faint);font-size:.85rem;border-top:1px solid var(--line);margin-top:40px;}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<header class="top-nav">
  <div class="container nav-row">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="17" stroke="url(#g1)" stroke-width="1.4"/><circle cx="20" cy="20" r="6" fill="url(#g1)" opacity=".85"/><defs><linearGradient id="g1" x1="0" y1="0" x2="40" y2="40"><stop offset="0" stop-color="#4fd8ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs></svg>
      Arena of Minds
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="debate-room.html">Debate</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="achievements.html" class="active">Achievements</a>
      <a href="settings.html">Settings</a>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-head reveal">
      <p class="eyebrow">Hall of Record</p>
      <h1>Achievements</h1>
      <p>Every argument you've won leaves a mark on the Arena. Some are still waiting to be claimed.</p>
    </div>

    <div class="progress-summary reveal">
      <span id="summary-text">0 / 5 Unlocked</span>
      <div class="bar"><div class="fill" id="summary-fill"></div></div>
    </div>

    <div class="ach-grid" id="ach-grid"></div>
  </div>
</main>

<footer>© 2026 Arena of Minds. Achievement data is tracked locally for this session.</footer>

<script>
(function(){
  'use strict';

  var ACHIEVEMENTS = [
    {
      id:'master-debater', name:'Master Debater',
      desc:'Win 25 debates across any chamber in the Arena.',
      progress:100, unlocked:true,
      icon:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>'
    },
    {
      id:'logic-lord', name:'Logic Lord',
      desc:'Score above 90 on the Logic metric in a single argument.',
      progress:78, unlocked:false,
      icon:'<path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4M12 8v8M8 12h8"/>'
    },
    {
      id:'persuasion-king', name:'Persuasion King',
      desc:'Land three arguments in a row scoring above 70.',
      progress:100, unlocked:false,
      icon:'<path d="M12 2l2.5 6.5L21 11l-6.5 2.5L12 20l-2.5-6.5L3 11l6.5-2.5z"/>'
    },
    {
      id:'einstein-slayer', name:'Einstein Slayer',
      desc:'Defeat Einstein in the Chamber of the Genius.',
      progress:40, unlocked:false,
      icon:'<circle cx="12" cy="9" r="4"/><path d="M4 20c1.5-5 5-7 8-7s6.5 2 8 7"/>'
    },
    {
      id:'arena-escapee', name:'Arena Escapee',
      desc:'Clear every chamber and step through the final gate.',
      progress:16, unlocked:false,
      icon:'<path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>'
    }
  ];

  var grid = document.getElementById('ach-grid');

  function render(){
    grid.innerHTML = '';
    ACHIEVEMENTS.forEach(function(a, idx){
      var claimable = a.progress >= 100 && !a.unlocked;
      var card = document.createElement('article');
      card.className = 'ach-card reveal ' + (a.unlocked ? 'unlocked' : (claimable ? 'claimable' : 'locked'));
      card.style.transitionDelay = (idx*0.06)+'s';
      card.dataset.id = a.id;

      card.innerHTML =
        '<div class="unlock-burst" aria-hidden="true"></div>'+
        (a.unlocked ? '<div class="checkmark-pop" style="opacity:1;transform:scale(1);"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' : '')+
        '<div class="ach-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+a.icon+'</svg></div>'+
        '<h3 class="ach-name">'+a.name+'</h3>'+
        '<p class="ach-desc">'+a.desc+'</p>'+
        '<div class="ach-progress-row"><span>Progress</span><span>'+a.progress+'%</span></div>'+
        '<div class="ach-track"><div class="ach-fill" data-fill style="width:0%"></div></div>'+
        (a.unlocked
          ? '<div class="ach-status"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Unlocked</div>'
          : (claimable ? '<button class="claim-btn" data-claim>Claim Achievement</button>' : ''));

      grid.appendChild(card);
    });
    updateSummary();
  }

  function updateSummary(){
    var unlocked = ACHIEVEMENTS.filter(function(a){ return a.unlocked; }).length;
    document.getElementById('summary-text').textContent = unlocked + ' / ' + ACHIEVEMENTS.length + ' Unlocked';
    document.getElementById('summary-fill').style.width = (unlocked/ACHIEVEMENTS.length*100) + '%';
  }

  grid.addEventListener('click', function(e){
    var btn = e.target.closest('[data-claim]');
    if(!btn) return;
    var card = btn.closest('.ach-card');
    var id = card.dataset.id;
    var a = ACHIEVEMENTS.find(function(x){ return x.id === id; });
    if(!a || a.unlocked) return;

    a.unlocked = true;
    card.classList.add('bursting');
    card.classList.remove('claimable');
    setTimeout(function(){
      card.classList.remove('bursting');
      card.classList.add('unlocked');
      btn.remove();
      var status = document.createElement('div');
      status.className = 'ach-status';
      status.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Unlocked';
      card.appendChild(status);
      var check = document.createElement('div');
      check.className = 'checkmark-pop';
      check.style.opacity = '1'; check.style.transform = 'scale(1)';
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      card.appendChild(check);
      updateSummary();
    }, 750);
  });

  render();

  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        e.target.classList.add('in');
        var fill = e.target.querySelector('[data-fill]');
        if(fill){
          var pct = fill.parentElement.previousElementSibling ? null : null;
        }
        observer.unobserve(e.target);
      }
    });
  }, {threshold:0.15});
  document.querySelectorAll('.reveal').forEach(function(el){ observer.observe(el); });

  // fill progress bars shortly after cards mount (separately from IO, so it
  // always plays even if the grid is already in view on load)
  setTimeout(function(){
    document.querySelectorAll('.ach-card').forEach(function(card, idx){
      var a = ACHIEVEMENTS[idx];
      var fill = card.querySelector('[data-fill]');
      if(fill && a){ setTimeout(function(){ fill.style.width = a.progress + '%'; }, idx*80); }
    });
  }, 400);

})();
</script>
</body>
</html>
